<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Yönləndirilir...</title>
    <script src="firebase-config.js"></script>
    <script>
        const query = window.location.search;
        const user = window.getActiveSessionUser ? window.getActiveSessionUser() : null;
        if (user && user.role === 'admin') {
            window.location.href = "admin-dashboard.html" + query;
        } else if (user && user.role === 'manager') {
            window.location.href = "manager-dashboard.html" + query;
        } else {
            window.location.href = "user-dashboard.html" + query;
        }
    </script>
</head>
<body>
    <p>Müvafiq panelə yönləndirilir...</p>
</body>
</html>
